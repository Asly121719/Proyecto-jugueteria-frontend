<div class="app-shell-container" [class.collapsed]="isSidebarCollapsed">
  <!-- SIDEBAR RETRAÍBLE -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2 *ngIf="!isSidebarCollapsed" class="app-title">ToyStore Admin</h2>
      <button type="button" class="toggle-btn" (click)="toggleSidebar()" title="Expandir/Retraer menú">
        ☰
      </button>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/juguetes" routerLinkActive="active" class="nav-item">
        <span class="icon">🧸</span>
        <span class="label" *ngIf="!isSidebarCollapsed">Juguetes</span>
      </a>
      <a routerLink="/tiendas" routerLinkActive="active" class="nav-item">
        <span class="icon">🏪</span>
        <span class="label" *ngIf="!isSidebarCollapsed">Tiendas</span>
      </a>
      <a routerLink="/empleados" routerLinkActive="active" class="nav-item">
        <span class="icon">👨‍💼</span>
        <span class="label" *ngIf="!isSidebarCollapsed">Empleados</span>
      </a>
      <a routerLink="/cargos" routerLinkActive="active" class="nav-item">
        <span class="icon">🏷️</span>
        <span class="label" *ngIf="!isSidebarCollapsed">Cargos</span>
      </a>
      <a routerLink="/categorias" routerLinkActive="active" class="nav-item">
        <span class="icon">📂</span>
        <span class="label" *ngIf="!isSidebarCollapsed">Categorías</span>
      </a>
      <a routerLink="/clientes" routerLinkActive="active" class="nav-item">
        <span class="icon">👥</span>
        <span class="label" *ngIf="!isSidebarCollapsed">Clientes</span>
      </a>
      <a routerLink="/proveedores" routerLinkActive="active" class="nav-item">
        <span class="icon">🚚</span>
        <span class="label" *ngIf="!isSidebarCollapsed">Proveedores</span>
      </a>
      <a routerLink="/inventario-tiendas" routerLinkActive="active" class="nav-item">
        <span class="icon">📦</span>
        <span class="label" *ngIf="!isSidebarCollapsed">Inventario</span>
      </a>
      <a routerLink="/promociones" routerLinkActive="active" class="nav-item">
        <span class="icon">🎟️</span>
        <span class="label" *ngIf="!isSidebarCollapsed">Promociones</span>
      </a>
      <a routerLink="/ventas" routerLinkActive="active" class="nav-item">
        <span class="icon">💰</span>
        <span class="label" *ngIf="!isSidebarCollapsed">Ventas</span>
      </a>
      <a routerLink="/garantias" routerLinkActive="active" class="nav-item">
        <span class="icon">🛡️</span>
        <span class="label" *ngIf="!isSidebarCollapsed">Garantías</span>
      </a>
    </nav>
  </aside>

  <!-- ÁREA DE TRABAJO PRINCIPAL (BODY) -->
  <main class="main-content">
    <header class="topbar">
      <span class="welcome-text">Panel de Administración</span>
    </header>
    <div class="content-body">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
